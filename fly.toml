app = "poynter-teaching-assistant"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running at all times so the app never has to wake up
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/_stcore/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
